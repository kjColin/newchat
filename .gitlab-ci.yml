stages:
  - test
  - build
  - deploy

backend_build:
  stage: build
  image: node:20
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - src/backend/.npm/
  script:
    - cd src/backend
    - npm ci --cache .npm --prefer-offline
    - npm run build

frontend_build:
  stage: build
  image: node:20
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - src/frontend/.npm/
  script:
    - cd src/frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build

deploy:
  stage: deploy
  script:
    - echo "Deploy is handled by the production host"
  only:
    - main
