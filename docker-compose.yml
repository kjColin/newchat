services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3101:3101"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatapp
      JWT_SECRET: dev-secret-change-in-prod
      HOST: 0.0.0.0
      PORT: 3101
    depends_on:
      - postgres
      - redis

  frontend:
    image: nginx:alpine
    volumes:
      - ./src/frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
