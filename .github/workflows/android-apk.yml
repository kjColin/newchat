name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-capacitor-apk
    paths:
      - .github/workflows/android-apk.yml
      - src/frontend/**
      - docs/android-apk.md

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build Android web assets
        run: VITE_API_BASE_URL=https://newchat.clnkj.de/api VITE_SOCKET_URL=https://newchat.clnkj.de npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify Android project files
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -f android/capacitor.settings.gradle
          test -x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: src/frontend/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: newchat-debug-apk
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
